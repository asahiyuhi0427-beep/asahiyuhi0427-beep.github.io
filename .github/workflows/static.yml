name: Publish portfolio to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract portfolio
        run: |
          mkdir -p _site
          unzip -q portfolio-site.zip -d _site
          test -f _site/index.html
          test -f _site/works/sanbiki-biyori/index.html
          test -f _site/works/nukone/index.html
          test -f _site/works/asahi-highball/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy portfolio
        id: deployment
        uses: actions/deploy-pages@v4
